<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Youth Skills Builder | Wtec1 Technologies</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="./assets/wtech.png" />
</head>
<body class="bg-gradient-to-br from-blue-50 via-white to-blue-100 min-h-screen p-4">

  <div class="max-w-md mx-auto bg-white shadow-2xl rounded-2xl p-6 mt-10">

    <!-- Header with Logo and Avatar -->
    <div class="flex items-center justify-between mb-6">
      <div class="flex items-center space-x-2">
        <img src="./assets/wtech.png" alt="Wtec1 Logo" class="h-8 w-8 rounded-full" />
        <h1 class="text-xl sm:text-2xl font-extrabold text-blue-700">
          Youth Skills
          <span class="text-sm font-normal text-gray-500 block">by Wtec1 Technologies</span>
        </h1>
      </div>
      
      <!-- Avatar -->
      <a href="profile.html" title="Your Profile">
        <img src="./assets/avatar.png" alt="User Avatar" class="h-9 w-9 rounded-full border border-blue-200 shadow hover:scale-105 transition" />
      </a>
    </div>

    <p class="text-gray-600 text-sm mb-6 leading-relaxed">
      Select a skill below to start learning practical skills that can improve your life or help you start a business.
    </p>

    <!-- Skills List -->
    <div id="skills-list" class="space-y-3">
      <!-- Skills will be loaded dynamically -->
    </div>

    <!-- Language switch -->
    <div class="mt-8 border-t pt-4 text-sm text-right text-blue-500 hover:text-blue-700 transition">
      🇲🇼 <span class="cursor-pointer">Switch to Chichewa</span>
    </div>
  </div>

  <!-- Footer Branding -->
  <div class="text-center text-xs text-gray-500 mt-6">
    © 2025 Wtec1 Technologies. Empowering Malawian Youth.
  </div>

  <script src="js/app.js"></script>
</body>
</html>
